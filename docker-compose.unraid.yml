# Single Compose for Unraid and local use. Cloudflare starts by default (no profile).
# Unraid: paste the whole file into Compose File and edit x-installation privately.
# Local: .env overrides the defaults; start only api admin-web to omit the tunnel.
# SOURCE_REF pins the application release. Keep the new default when upgrading.
# Never commit private settings. Escape literal dollar signs in inline values as $$.
x-installation:
  SOURCE_REF: &source_ref "${SOURCE_REF:-38bcca181f12ec258f885e31961604386f6f7532}"
  SOURCE_URL: &source_url "${SOURCE_URL:-}"
  GITHUB_TOKEN: &github_token "${GITHUB_TOKEN:-}"
  PAN_HASH_SECRET: &pan_secret "${PAN_HASH_SECRET:-REPLACE_WITH_STABLE_RANDOM_SECRET}"
  BOOTSTRAP_ADMIN_USERNAME: &admin_user "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
  BOOTSTRAP_ADMIN_PASSWORD: &admin_password "${BOOTSTRAP_ADMIN_PASSWORD:-REPLACE_WITH_RANDOM_PASSWORD}"
  PUBLIC_API_URL: &api_url "${PUBLIC_API_URL:-https://api.slmartinez.org}"
  PUBLIC_ADMIN_URL: &admin_url "${PUBLIC_ADMIN_URL:-https://admin.slmartinez.org}"
  GOOGLE_ISSUER_ID: &google_issuer "${GOOGLE_ISSUER_ID:-}"
  APPLE_TEAM_ID: &apple_team "${APPLE_TEAM_ID:-}"
  APPLE_PASS_TYPE_ID: &apple_pass_type "${APPLE_PASS_TYPE_ID:-pass.org.slmartinez.loyalty}"
  APPLE_CERT_PASSWORD: &apple_password "${APPLE_CERT_PASSWORD:-}"
  APPLE_WEBSERVICE_URL: &apple_url "${APPLE_WEBSERVICE_URL:-https://api.slmartinez.org}"
  SESSION_HOURS: &session_hours "${SESSION_HOURS:-12}"
  AUTH_ENABLED: &auth_enabled "${AUTH_ENABLED:-false}"
  PASS_ASSET_MAX_BYTES: &asset_max_bytes "${PASS_ASSET_MAX_BYTES:-4194304}"
  PASS_ASSET_MAX_PIXELS: &asset_max_pixels "${PASS_ASSET_MAX_PIXELS:-16777216}"
  CLOUDFLARE_TUNNEL_TOKEN: &tunnel_token "${CLOUDFLARE_TUNNEL_TOKEN:-}"
  DATA_MOUNT: &data_mount "${DATA_DIR:-/mnt/user/appdata/loyalty-platform/data}:/data"
  CERTS_MOUNT: &certs_mount "${CERTS_DIR:-/mnt/user/appdata/loyalty-platform/data/certs}:/certs:ro"

  API_PORT: &api_port "127.0.0.1:${API_PORT:-18000}:8000"
  ADMIN_PORT: &admin_port "127.0.0.1:${ADMIN_PORT:-18080}:80"

services:
  source:
    image: python:3.12-slim
    restart: "no"
    environment:
      SOURCE_REF: *source_ref
      SOURCE_URL: *source_url
      GITHUB_TOKEN: *github_token
    volumes:
      - source:/source
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, pathlib, re, shutil, tarfile, tempfile, urllib.request
        ref = os.environ['SOURCE_REF']
        if not re.fullmatch(r'[0-9a-f]{40}', ref):
            raise SystemExit('SOURCE_REF must be a full Git commit SHA')
        root = pathlib.Path('/source')
        target = root / ref
        if not (target / '.ready').exists():
            with tempfile.TemporaryDirectory(dir=root) as scratch:
                scratch = pathlib.Path(scratch)
                archive = scratch / 'source.tar.gz'
                token = os.environ.get('GITHUB_TOKEN', '')
                url = os.environ.get('SOURCE_URL')
                headers = {}
                if not url:
                    if token:
                        url = 'https://api.github.com/repos/slganimedes/Loyalty-platform/tarball/' + ref
                        headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
                    else:
                        url = 'https://codeload.github.com/slganimedes/Loyalty-platform/tar.gz/' + ref
                request = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(request, timeout=60) as response, archive.open('wb') as output:
                    shutil.copyfileobj(response, output)
                unpack = scratch / 'unpack'
                unpack.mkdir()
                with tarfile.open(archive) as bundle:
                    bundle.extractall(unpack, filter='data')
                entries = list(unpack.iterdir())
                if len(entries) != 1 or not entries[0].is_dir():
                    raise SystemExit('Expected a GitHub source archive')
                repo = entries[0]
                for required in ['api/requirements.txt', 'admin-web/package-lock.json', 'scripts/start_api.sh']:
                    if not (repo / required).is_file():
                        raise SystemExit('Commit lacks deployment files: ' + required)
                (repo / '.ready').write_text(ref)
                repo.rename(target)
        print('Source ready at commit ' + ref)
  web-build:
    image: node:22-alpine
    restart: "no"
    environment:
      SOURCE_REF: *source_ref
    depends_on:
      source:
        condition: service_completed_successfully
    volumes:
      - source:/source:ro
      - web:/web
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        work=$$(mktemp -d)
        cp -R /source/$$SOURCE_REF/admin-web/. "$$work/"
        cd "$$work"
        npm ci --no-audit --no-fund
        npm run build
        mkdir -p /web/$$SOURCE_REF
        cp -R dist/. /web/$$SOURCE_REF/
  api:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      SOURCE_REF: *source_ref
      DATABASE_URL: sqlite:////data/loyalty.db
      ASSETS_DIR: /data/assets
      AUTH_ENABLED: *auth_enabled
      PAN_HASH_SECRET: *pan_secret
      BOOTSTRAP_ADMIN_USERNAME: *admin_user
      BOOTSTRAP_ADMIN_PASSWORD: *admin_password
      PUBLIC_API_URL: *api_url
      PUBLIC_ADMIN_URL: *admin_url
      GOOGLE_ISSUER_ID: *google_issuer
      GOOGLE_SA_JSON: /certs/google-sa.json
      APPLE_TEAM_ID: *apple_team
      APPLE_PASS_TYPE_ID: *apple_pass_type
      APPLE_CERT_PATH: /certs/pass.p12
      APPLE_CERT_PASSWORD: *apple_password
      APPLE_WWDR_CERT_PATH: /certs/wwdr.pem
      APPLE_WEBSERVICE_URL: *apple_url
      SESSION_HOURS: *session_hours
      PASS_ASSET_MAX_BYTES: *asset_max_bytes
      PASS_ASSET_MAX_PIXELS: *asset_max_pixels
    depends_on:
      source:
        condition: service_completed_successfully
    volumes:
      - source:/source:ro
      - python-env:/python-env
      - *data_mount
      - *certs_mount
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec /bin/sh /source/$$SOURCE_REF/scripts/start_api.sh']
    expose: ["8000"]
    ports: [*api_port]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
  admin-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      SOURCE_REF: *source_ref
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - source:/source:ro
      - web:/web:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /source/$$SOURCE_REF/admin-web/nginx.conf /etc/nginx/conf.d/default.conf
        sed -i "s|/usr/share/nginx/html|/web/$$SOURCE_REF|" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    ports: [*admin_port]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: *tunnel_token
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
volumes:
  source:
  web:
  python-env:
