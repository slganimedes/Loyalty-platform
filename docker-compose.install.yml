# Copy to docker-compose.private.yml before filling in credentials.
# Edit only x-installation. No .env required. Do not commit the private copy.
# For a literal dollar sign in a value, enter $$ (Docker Compose escaping).
x-installation:
  SOURCE_REF: &source_ref "REPLACE_WITH_PUBLISHED_COMMIT"
  SOURCE_URL: &source_url ""
  GITHUB_TOKEN: &github_token ""
  PAN_HASH_SECRET: &pan_secret "REPLACE_WITH_STABLE_RANDOM_SECRET"
  BOOTSTRAP_ADMIN_USERNAME: &admin_user "admin"
  BOOTSTRAP_ADMIN_PASSWORD: &admin_password "REPLACE_WITH_RANDOM_PASSWORD"
  PUBLIC_API_URL: &api_url "https://api.slmartinez.org"
  PUBLIC_ADMIN_URL: &admin_url "https://admin.slmartinez.org"
  GOOGLE_ISSUER_ID: &google_issuer ""
  APPLE_TEAM_ID: &apple_team ""
  APPLE_PASS_TYPE_ID: &apple_pass_type "pass.org.slmartinez.loyalty"
  APPLE_CERT_PASSWORD: &apple_password ""
  APPLE_WEBSERVICE_URL: &apple_url "https://api.slmartinez.org"
  SESSION_HOURS: &session_hours "12"
  CLOUDFLARE_TUNNEL_TOKEN: &tunnel_token ""
  DATA_MOUNT: &data_mount "./data:/data"
  CERTS_MOUNT: &certs_mount "./data/certs:/certs:ro"
  API_PORT: &api_port "127.0.0.1:8000:8000"
  ADMIN_PORT: &admin_port "127.0.0.1:8080:80"

services:
  source:
    image: python:3.12-slim
    restart: "no"
    environment:
      SOURCE_REF: *source_ref
      SOURCE_URL: *source_url
      GITHUB_TOKEN: *github_token
    volumes:
      - source:/source
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, pathlib, re, shutil, tarfile, tempfile, urllib.request
        ref = os.environ['SOURCE_REF']
        if not re.fullmatch(r'[0-9a-f]{40}', ref):
            raise SystemExit('SOURCE_REF must be a full Git commit SHA')
        root = pathlib.Path('/source')
        target = root / ref
        if not (target / '.ready').exists():
            with tempfile.TemporaryDirectory(dir=root) as scratch:
                scratch = pathlib.Path(scratch)
                archive = scratch / 'source.tar.gz'
                token = os.environ.get('GITHUB_TOKEN', '')
                url = os.environ.get('SOURCE_URL')
                headers = {}
                if not url:
                    if token:
                        url = 'https://api.github.com/repos/slganimedes/Loyalty-platform/tarball/' + ref
                        headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
                    else:
                        url = 'https://codeload.github.com/slganimedes/Loyalty-platform/tar.gz/' + ref
                request = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(request, timeout=60) as response, archive.open('wb') as output:
                    shutil.copyfileobj(response, output)
                unpack = scratch / 'unpack'
                unpack.mkdir()
                with tarfile.open(archive) as bundle:
                    bundle.extractall(unpack, filter='data')
                entries = list(unpack.iterdir())
                if len(entries) != 1 or not entries[0].is_dir():
                    raise SystemExit('Expected a GitHub source archive')
                repo = entries[0]
                for required in ['api/requirements.txt', 'admin-web/package-lock.json', 'scripts/start_api.sh']:
                    if not (repo / required).is_file():
                        raise SystemExit('Commit lacks deployment files: ' + required)
                (repo / '.ready').write_text(ref)
                repo.rename(target)
        print('Source ready at commit ' + ref)
  web-build:
    image: node:22-alpine
    restart: "no"
    environment:
      SOURCE_REF: *source_ref
    depends_on:
      source:
        condition: service_completed_successfully
    volumes:
      - source:/source:ro
      - web:/web
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        work=$$(mktemp -d)
        cp -R /source/$$SOURCE_REF/admin-web/. "$$work/"
        cd "$$work"
        npm ci --no-audit --no-fund
        npm run build
        mkdir -p /web/$$SOURCE_REF
        cp -R dist/. /web/$$SOURCE_REF/
  api:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      SOURCE_REF: *source_ref
      DATABASE_URL: sqlite:////data/loyalty.db
      ASSETS_DIR: /data/assets
      PAN_HASH_SECRET: *pan_secret
      BOOTSTRAP_ADMIN_USERNAME: *admin_user
      BOOTSTRAP_ADMIN_PASSWORD: *admin_password
      PUBLIC_API_URL: *api_url
      PUBLIC_ADMIN_URL: *admin_url
      GOOGLE_ISSUER_ID: *google_issuer
      GOOGLE_SA_JSON: /certs/google-sa.json
      APPLE_TEAM_ID: *apple_team
      APPLE_PASS_TYPE_ID: *apple_pass_type
      APPLE_CERT_PATH: /certs/pass.p12
      APPLE_CERT_PASSWORD: *apple_password
      APPLE_WWDR_CERT_PATH: /certs/wwdr.pem
      APPLE_WEBSERVICE_URL: *apple_url
      SESSION_HOURS: *session_hours
    depends_on:
      source:
        condition: service_completed_successfully
    volumes:
      - source:/source:ro
      - python-env:/python-env
      - *data_mount
      - *certs_mount
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec /bin/sh /source/$$SOURCE_REF/scripts/start_api.sh']
    expose: ["8000"]
    ports: [*api_port]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
  admin-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      SOURCE_REF: *source_ref
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - source:/source:ro
      - web:/web:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /source/$$SOURCE_REF/admin-web/nginx.conf /etc/nginx/conf.d/default.conf
        sed -i "s|/usr/share/nginx/html|/web/$$SOURCE_REF|" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    ports: [*admin_port]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: *tunnel_token
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
volumes:
  source:
  web:
  python-env:
